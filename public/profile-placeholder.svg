<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a22" />
      <stop offset="55%" stop-color="#111116" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)" />
  <rect width="800" height="1000" fill="url(#glow)" />

  <!-- faint grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 0 L800 1000 M800 0 L0 1000" />
  </g>

  <!-- generic silhouette -->
  <g fill="#ffffff" fill-opacity="0.12">
    <circle cx="400" cy="380" r="140" />
    <path d="M170 900 C170 690 260 560 400 560 C540 560 630 690 630 900 Z" />
  </g>

  <!-- dashed placeholder frame -->
  <rect x="24" y="24" width="752" height="952" rx="16"
        fill="none" stroke="#ffffff" stroke-opacity="0.25"
        stroke-width="3" stroke-dasharray="10 10" />

  <text x="400" y="960" text-anchor="middle"
        font-family="monospace" font-size="22" letter-spacing="2"
        fill="#ffffff" fill-opacity="0.55">
    REPLACE — /public/profile-photo.jpg
  </text>
</svg>
