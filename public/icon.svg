<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>

    <!-- Glowing Ring Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="50%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#39ff14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Subtle Accent Grid Lines -->
  <path d="M120 160 H392 M120 352 H392" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Bold UI/UX Friendly Typography: "ron" -->
  <g filter="url(#glow)">
    <text 
      x="236" 
      y="300" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Outfit', sans-serif" 
      font-weight="900" 
      font-size="190" 
      letter-spacing="-6"
      text-anchor="middle" 
      fill="url(#textGrad)"
    >ron</text>

    <!-- Glowing Signature Dot -->
    <circle cx="395" cy="285" r="22" fill="#39ff14"/>
  </g>
</svg>
